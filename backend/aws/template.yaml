AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Flashbook AWS Lambda + API Gateway + DynamoDB + Cognito backend

Parameters:
  GeminiApiKeyParam:
    Type: String
    NoEcho: true
    Description: "Gemini API Key (get from https://aistudio.google.com/app/apikey)"

Globals:
  Function:
    Runtime: python3.13
    Timeout: 29
    MemorySize: 512
    Environment:
      Variables:
        GEMINI_API_KEY: !Ref GeminiApiKeyParam
        GEMINI_MODEL_TEXT: "gemini-2.0-flash"
        GEMINI_MODEL_IMAGE: "gemini-2.0-flash-exp-image-generation"
        SLIDES_TABLE: !Ref SlidesTable
        NOTES_TABLE: !Ref NotesTable
        IMAGES_BUCKET: !Ref ImagesBucket
        USER_BOOKS_TABLE: !Ref UserBooksTable
        PDF_BUCKET: !Ref PdfBucket
        COGNITO_USER_POOL_ID: !Ref CognitoUserPool
        COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient

Resources:

  # ===== Cognito User Pool =====
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: flashbook-users
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: flashbook-app
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ===== API Gateway =====
  FlashbookApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      BinaryMediaTypes:
        - "multipart/form-data"
        - "application/octet-stream"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # ===== API Gateway CORS error responses =====
  # Ensures 4xx/5xx responses from authorizer/Gateway include CORS headers
  # so the browser can read the error body instead of showing "CORS error"
  GatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref FlashbookApi

  GatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref FlashbookApi

  # ===== Lambda: GET /health (no auth) =====
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flashbook-health
      CodeUri: handlers/
      Handler: health.lambda_handler
      MemorySize: 128
      Timeout: 5
      Events:
        GetHealth:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE

  # ===== Lambda: /auth/* (no auth) =====
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flashbook-auth
      CodeUri: handlers/
      Handler: auth.lambda_handler
      MemorySize: 256
      Timeout: 10
      Events:
        AuthSignup:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /auth/signup
            Method: post
            Auth:
              Authorizer: NONE
        AuthLogin:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /auth/login
            Method: post
            Auth:
              Authorizer: NONE
        AuthVerify:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /auth/verify
            Method: post
            Auth:
              Authorizer: NONE
        AuthRefresh:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /auth/refresh
            Method: post
            Auth:
              Authorizer: NONE

  # ===== Lambda: POST /extractText =====
  ExtractTextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flashbook-extract-text
      CodeUri: handlers/
      Handler: extract_text.lambda_handler
      MemorySize: 512
      Timeout: 30
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PdfBucket
      Events:
        PostExtractText:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /extractText
            Method: post

  # ===== Lambda: POST /generateSummary =====
  GenerateSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flashbook-generate-summary
      CodeUri: handlers/
      Handler: generate_summary.lambda_handler
      MemorySize: 1024
      Timeout: 29
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlidesTable
      Events:
        PostGenerateSummary:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /generateSummary
            Method: post

  # ===== Lambda: POST /generateImage =====
  GenerateImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flashbook-generate-image
      CodeUri: handlers/
      Handler: generate_image.lambda_handler
      MemorySize: 1024
      Timeout: 29
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        PostGenerateImage:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /generateImage
            Method: post

  # ===== Lambda: /notes/* CRUD =====
  NotesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flashbook-notes
      CodeUri: handlers/
      Handler: notes.lambda_handler
      MemorySize: 256
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref NotesTable
      Events:
        NotesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /notes/
            Method: get
        NotesCreate:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /notes/create
            Method: post
        NotesByBook:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /notes/book/{book_id}
            Method: get
        NotesGetById:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /notes/{note_id}
            Method: get
        NotesUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /notes/{note_id}
            Method: put
        NotesDelete:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /notes/{note_id}
            Method: delete

  # ===== Lambda: /books/* CRUD =====
  BooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: flashbook-books
      CodeUri: handlers/
      Handler: books.lambda_handler
      MemorySize: 512
      Timeout: 15
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserBooksTable
        - S3CrudPolicy:
            BucketName: !Ref PdfBucket
      Events:
        BooksUpload:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /books/upload
            Method: post
        BooksConfirm:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /books/{book_id}/confirm
            Method: post
        BooksList:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /books
            Method: get
        BooksProgress:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /books/{book_id}/progress
            Method: put
        BooksDelete:
          Type: Api
          Properties:
            RestApiId: !Ref FlashbookApi
            Path: /books/{book_id}
            Method: delete

  # ===== S3: Generated Images (private, accessed via presigned URLs) =====
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "flashbook-images-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: ["GET"]
            AllowedHeaders: ["*"]
            MaxAge: 86400

  # ===== S3: User PDF Uploads =====
  PdfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "flashbook-pdfs-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ["*"]
            AllowedMethods: ["GET", "PUT"]
            AllowedHeaders: ["*"]
            MaxAge: 86400
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldPdfs
            Status: Enabled
            ExpirationInDays: 90

  # ===== DynamoDB: Slides Cache =====
  SlidesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: flashbook-slides
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: book_id
          AttributeType: S
        - AttributeName: chapter_hash
          AttributeType: S
      KeySchema:
        - AttributeName: book_id
          KeyType: HASH
        - AttributeName: chapter_hash
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: expires_at

  # ===== DynamoDB: Notes =====
  NotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: flashbook-notes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: note_id
          AttributeType: S
        - AttributeName: book_id
          AttributeType: S
      KeySchema:
        - AttributeName: note_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: book_id-index
          KeySchema:
            - AttributeName: book_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ===== DynamoDB: User Books & Progress =====
  UserBooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: flashbook-user-books
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: book_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: book_id
          KeyType: RANGE

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL — paste this into Flutter PROD_URL"
    Value: !Sub "https://${FlashbookApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: FlashbookApiUrl
  SlidesTableName:
    Value: !Ref SlidesTable
  NotesTableName:
    Value: !Ref NotesTable
  ImagesBucketName:
    Value: !Ref ImagesBucket
  PdfBucketName:
    Value: !Ref PdfBucket
  UserBooksTableName:
    Value: !Ref UserBooksTable
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
