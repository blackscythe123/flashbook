<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flashbook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flashbook</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* ── Desktop: center the app in a mobile-sized frame ─────────────────── */
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      width: 100%;
    }

    /* On desktop (>600px wide), constrain to a phone-sized column */
    @media (min-width: 600px) {
      body {
        display: flex;
        justify-content: center;
        align-items: stretch;
      }

      /* Flutter mounts into this element */
      #flutter_target {
        width: 390px;          /* iPhone 14 Pro width */
        max-width: 430px;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 60px rgba(255,255,255,0.08);
      }
    }

    /* On real mobile: fill the whole screen */
    @media (max-width: 599px) {
      #flutter_target {
        width: 100%;
        height: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="flutter_target"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
