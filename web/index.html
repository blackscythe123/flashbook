<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Viewport: full mobile screen, support notches/safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="flashbook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flashbook</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* ── Global: no margins, full viewport ────────────────────────────────── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Desktop (≥600px): center app in mobile-sized frame ──────────────── */
    @media (min-width: 600px) {
      body {
        display: flex;
        justify-content: center;
        align-items: stretch;
      }

      #flutter_target {
        width: 390px;          /* iPhone 14 Pro width */
        max-width: 430px;
        border-radius: 4px;
        box-shadow: 0 0 60px rgba(255,255,255,0.08);
        overflow: hidden;
      }
    }

    /* ── Mobile (<600px): fill entire screen, support safe areas ──────────── */
    @media (max-width: 599px) {
      body {
        height: 100vh;
        width: 100vw;
        position: fixed;
        top: 0;
        left: 0;
      }

      html {
        height: 100vh;
      }

      #flutter_target {
        width: 100%;
        height: 100%;
        /* Extend into notches on iOS */
        padding-top: max(0px, env(safe-area-inset-top));
        padding-bottom: max(0px, env(safe-area-inset-bottom));
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <div id="flutter_target"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
